name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  run-pipeline:
    uses: Volontariapp/ci-tools/.github/workflows/npm-packages-pipeline.yml@main
    secrets:
      ORG_REPO_TOKEN: ${{ secrets.ORG_REPO_TOKEN }}
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  update-deploy-submodule:
    needs: run-pipeline
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Deploy Repo
        uses: actions/checkout@v7
        with:
          repository: Volontariapp/deploy
          token: ${{ secrets.ORG_REPO_TOKEN }}
          path: deploy
          submodules: true
      - name: Update npm-packages submodule
        run: |
          cd deploy
          git submodule update --remote submodules/npm-packages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add submodules/npm-packages
          git commit -m "chore: bump npm-packages submodule" || echo "No changes to commit"
          git push origin main

  notify-ready:
    needs: [run-pipeline]
    # `needs:` implies success(): without !failure() a skipped job would skip the notification.
    if: ${{ !failure() && !cancelled() && github.event_name == 'pull_request' }}
    # A reusable workflow cannot raise the permissions of its caller.
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: Volontariapp/ci-tools/.github/workflows/pr-ready-notify.yml@main
    with:
      channel: backend
    # ORG_REPO_TOKEN is deliberately NOT passed: this workflow also runs on `labeled`, and a label
    # set with a personal token would start a full pipeline run (snapshot publication included).
    secrets:
      DISCORD_WEBHOOK_BACKEND: ${{ secrets.DISCORD_WEBHOOK_BACKEND }}
      DISCORD_WEBHOOK_FRONTEND: ${{ secrets.DISCORD_WEBHOOK_FRONTEND }}
