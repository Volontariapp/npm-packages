# Generated from Volontariapp/ci-tools templates/dependabot by sync-dependabot.yml: do not edit here.
# Dependabot PRs carry docker-e2e and docker-and-e2e (the latter is required by the CI).
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/packages/*"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker-and-e2e"
      - "docker-e2e"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # Held on the Node 24 / NestJS 11 line used by every @volontariapp/* package (peer ranges ^11).
      # Lift these once npm-packages is migrated and published for the next line.
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # A single pull request per week for every version update (majors and @volontariapp/* included):
      # the E2E suite runs once instead of once per dependency.
      dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      # Security updates keep their own pull request so they are never held back by a risky major bump.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "docker-and-e2e"
      - "docker-e2e"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
