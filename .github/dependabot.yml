# Dependabot PRs carry docker-e2e and docker-and-e2e (the latter is required by the CI). Source: Volontariapp/ci-tools templates/dependabot.
version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/packages/*"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker-and-e2e"
      - "docker-e2e"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "docker-and-e2e"
      - "docker-e2e"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
