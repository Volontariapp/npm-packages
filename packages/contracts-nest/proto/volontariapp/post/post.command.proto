syntax = "proto3";

package volontariapp.post;

import "volontariapp/post/post.proto";

message CreatePostCommand {
  string title = 1;
  string content = 2;
  optional string event_id = 3;
  // Ids of the uploaded files, in display order. Empty for a post without media.
  repeated string file_ids = 4;
  // Client-generated key: retrying the same request yields the same post.
  string idempotency_key = 5;
}

message AdminCreatePostCommand {
  string author_id = 1;
  string title = 2;
  string content = 3;
  optional string event_id = 4;
}

message UpdatePostCommand {
  Post post = 2;
  repeated string update_mask = 3;
}

message DeletePostCommand {
  string id = 1;
}

message DeleteMyPostsCommand {
}