syntax = "proto3";

package volontariapp.post;

import "google/protobuf/timestamp.proto";
import "volontariapp/common/pagination.proto";

message ListCommentsQuery {
  string post_id = 1;
  volontariapp.common.PaginationRequest pagination = 2;
}

message ListCommentsByAuthorQuery {
  string author_id = 1;
  google.protobuf.Timestamp since = 2;
  // Capped at 200 server side.
  int32 limit = 3;
}
