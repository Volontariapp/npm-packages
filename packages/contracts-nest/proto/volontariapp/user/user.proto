syntax = "proto3";

package volontariapp.user;

import "google/protobuf/timestamp.proto";

message OrganisationInfo {
  string rna = 1;
}

message Badge {
  string id = 1;
  string name = 2;
  string slug = 3;
  // Deprecated: use icon_file_id.
  optional string icon_path = 4 [deprecated = true];
  string description = 5;
  google.protobuf.Timestamp awarded_at = 6;
  optional string icon_file_id = 7;
  // Points credited to total_impact_score when the badge is awarded.
  int32 points = 8;
}

// Progress of one metric towards a badge (current is capped at target).
message BadgeRequirementProgress {
  string metric = 1;
  int32 current = 2;
  int32 target = 3;
}

// Progress of the caller towards one badge of the catalogue.
message BadgeProgress {
  string slug = 1;
  string name = 2;
  string description = 3;
  int32 points = 4;
  bool unlocked = 5;
  google.protobuf.Timestamp awarded_at = 6;
  // 0 to 100. Always 100 when unlocked.
  int32 percent = 7;
  repeated BadgeRequirementProgress requirements = 8;
  optional string icon_file_id = 9;
}

message User {
  string id = 1;
  string email = 2;
  string pseudo = 3;
  optional string bio = 4;
  string role = 5;
  // Deprecated: use avatar_file_id.
  optional string logo_path = 6 [deprecated = true];
  int32 total_impact_score = 7;
  optional OrganisationInfo organisation_info = 8;
  repeated Badge badges = 9;
  optional string avatar_file_id = 10;
}

message UserPublic {
  string id = 1;
  string pseudo = 2;
  optional string bio = 3;
  // Deprecated: use avatar_file_id.
  optional string logo_path = 4 [deprecated = true];
  int32 total_impact_score = 5;
  optional OrganisationInfo organisation_info = 6;
  repeated Badge badges = 7;
  optional string avatar_file_id = 8;
}

// Leaderboard period: all-time total, current week or current month (Europe/Paris).
enum LeaderboardScope {
  LEADERBOARD_SCOPE_UNSPECIFIED = 0;
  LEADERBOARD_SCOPE_GLOBAL = 1;
  LEADERBOARD_SCOPE_WEEK = 2;
  LEADERBOARD_SCOPE_MONTH = 3;
}

// A distinction earned on one leaderboard. tier is 1 (first), 2 or 3.
message LeaderboardDistinction {
  LeaderboardScope scope = 1;
  int32 tier = 2;
}

message LeaderboardEntry {
  string user_id = 1;
  string pseudo = 2;
  optional string avatar_file_id = 3;
  int32 points = 4;
  int32 rank = 5;
  repeated LeaderboardDistinction distinctions = 6;
}
