syntax = "proto3";

package volontariapp.user;

import "volontariapp/user/user.proto";

message SignUpCommand {
  string email = 1;
  string password = 2;
  optional string phone = 3;
  optional string pseudo = 4;
  optional string bio = 5;
  // Deprecated: avatars are attached through avatar_file_id after sign-up.
  optional string logo_path = 6 [deprecated = true];
  optional OrganisationInfo organisation_info = 7;
}

message UpdateUserCommand {
  optional string email = 1;
  optional string previous_password = 2;
  optional string new_password = 3;
  optional string phone = 4;
  optional string pseudo = 5;
  optional string bio = 6;
  // Deprecated: use avatar_file_id.
  optional string logo_path = 7 [deprecated = true];
  optional OrganisationInfo organisation_info = 8;
  optional string avatar_file_id = 9;
}

message DeleteUserCommand {
}

message AdminUpdateUserCommand {
  string user_id = 1;
  optional string email = 2;
  optional string previous_password = 3;
  optional string new_password = 4;
  optional string phone = 5;
  optional string pseudo = 6;
  optional string bio = 7;
  optional string logo_path = 8;
  optional OrganisationInfo organisation_info = 9;
}

message AdminDeleteUserCommand {
  string user_id = 1;
}

message LoginCommand {
  string email = 1;
  string password = 2;
}

message RefreshTokenCommand {
  string refresh_token = 1;
}

message IncrementImpactScoreCommand {
  string user_id = 1;
  int32 score_increment = 2;
}

message CreateBadgeCommand {
  string name = 1;
  string slug = 2;
  // Deprecated: use icon_file_id.
  optional string icon_path = 3 [deprecated = true];
  string description = 4;
  optional string icon_file_id = 5;
  string idempotency_key = 6;
}

message DeleteBadgeCommand {
  string badge_id = 1;
}

message UpdateBadgeCommand {
  string badge_id = 1;
  optional string name = 2;
  optional string slug = 3;
  // Deprecated: use icon_file_id.
  optional string icon_path = 4 [deprecated = true];
  optional string description = 5;
  optional string icon_file_id = 6;
}

message AddBadgeToUserCommand {
  string user_id = 1;
  string badge_id = 2;
}

message RemoveBadgeFromUserCommand {
  string user_id = 1;
  string badge_id = 2;
}