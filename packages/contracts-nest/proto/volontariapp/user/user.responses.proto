syntax = "proto3";

package volontariapp.user;

import "volontariapp/common/pagination.proto";
import "volontariapp/user/user.proto";

message UserResponse {
  User user = 1;
}

message PublicUserResponse {
  UserPublic user_public = 1;
}

message AdminUserResponse {
  User user = 1;
}

message SignUpResponse {
  User user = 1;
  AuthResponse auth = 2;
}

message ListUsersResponse {
  repeated User users = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}

message GetUsersByIdsResponse {
  repeated User users = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}

message GetMyFollowsProfilesResponse {
  repeated User users = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}

message GetMyFollowersProfilesResponse {
  repeated User users = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}

message GetEventParticipantsProfilesResponse {
  repeated UserPublic users = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}

message GetPostLikersProfilesResponse {
  repeated UserPublic users = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}

message UpdateUserResponse {
}

message AdminUpdateUserResponse {
}

message DeleteUserResponse {
}

message AdminDeleteUserResponse {
}

message AuthResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message LoginResponse {
  AuthResponse auth = 1;
}

message RefreshTokenResponse {
  AuthResponse auth = 1;
}

message IncrementImpactScoreResponse {
}

message CreateBadgeResponse {
  Badge badge = 1;
}

message UpdateBadgeResponse {
}

message DeleteBadgeResponse {
}

message AddBadgeToUserResponse {
}

message RemoveBadgeFromUserResponse {
}

message BadgeResponse {
  Badge badge = 1;
}

message GetBadgeBySlugResponse {
  Badge badge = 1;
}

message GetMyBadgeProgressResponse {
  repeated BadgeProgress badges = 1;
}

message ListBadgesResponse {
  repeated Badge badges = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}

message GetLeaderboardResponse {
  repeated LeaderboardEntry entries = 1;
  // Absent when there is no further page.
  optional string next_cursor = 2;
}

message GetMyRankResponse {
  // Absent when the caller has no rank on this scope yet.
  optional LeaderboardEntry me = 1;
  // Up to 5 entries above and 5 below the caller, ordered by rank.
  repeated LeaderboardEntry neighbors = 2;
}