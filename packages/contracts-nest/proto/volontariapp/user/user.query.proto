syntax = "proto3";

package volontariapp.user;

import "volontariapp/common/pagination.proto";
import "volontariapp/user/user.proto";

message GetUserQuery {
}

message GetPublicUserQuery {
  string user_id = 1;
}

message AdminGetUserQuery {
  string user_id = 1;
}

message ListUsersQuery {
  volontariapp.common.PaginationRequest pagination = 1;
}

message GetUsersByIdsQuery {
  // At most 100 ids per call.
  repeated string ids = 1;
}

message GetBadgeQuery {
  string badge_id = 1;
}

message ListBadgesQuery {
  volontariapp.common.PaginationRequest pagination = 1;
}

message GetMyBadgeProgressQuery {
}

message GetBadgeBySlugQuery {
  string slug = 1;
}

message GetMyFollowsProfilesQuery {
  volontariapp.common.PaginationRequest pagination = 1;
}

message GetMyFollowersProfilesQuery {
  volontariapp.common.PaginationRequest pagination = 1;
}

message GetEventParticipantsProfilesQuery {
  string event_id = 1;
  volontariapp.common.PaginationRequest pagination = 2;
}

message GetPostLikersProfilesQuery {
  string post_id = 1;
  volontariapp.common.PaginationRequest pagination = 2;
}

message GetLeaderboardQuery {
  LeaderboardScope scope = 1;
  // Opaque cursor returned by the previous page; absent for the first page.
  optional string cursor = 2;
  // Page size, between 1 and 100.
  int32 limit = 3;
}

message GetMyRankQuery {
  LeaderboardScope scope = 1;
}