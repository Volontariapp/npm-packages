syntax = "proto3";

package volontariapp.storage;

import "volontariapp/storage/storage.proto";

message GenerateUploadUrlCommand {
  string mime_type = 1;
  int64 size_bytes = 2;
  EntityType entity_type = 3;
  bool is_public = 4;
}

message ConfirmFileAttachmentCommand {
  repeated string file_ids = 1;
  EntityType entity_type = 2;
  string entity_id = 3;
}

message DeleteFileCommand {
  string file_id = 1;
}
