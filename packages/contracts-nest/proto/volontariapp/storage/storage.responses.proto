syntax = "proto3";

package volontariapp.storage;

import "google/protobuf/timestamp.proto";
import "volontariapp/storage/storage.proto";

message GenerateUploadUrlResponse {
  string file_id = 1;
  string upload_url = 2;
  google.protobuf.Timestamp expires_at = 3;
  // Fields of the signed POST form.
  map<string, string> upload_fields = 4;
}

message ConfirmUploadResponse {
  // SCANNING (ASYNC) or final state (SYNC).
  FileMetadata file = 1;
}

message ConfirmFileAttachmentResponse {
  bool success = 1;
  int32 updated_count = 2;
  repeated FileMetadata files = 3;
}

message DeleteFileResponse {
  bool success = 1;
}

message FileMetadataResponse {
  FileMetadata file = 1;
}

message VerifyFilesExistResponse {
  bool all_exist = 1;
  repeated string missing_file_ids = 2;
}

