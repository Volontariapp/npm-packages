message AdminPostFollowUserResponse {}
message DeleteFollowUserResponse {}
message AdminDeleteFollowUserResponse {}
message PostBlockUserResponse {}
message AdminPostBlockUserResponse {}
message DeleteBlockUserResponse {}
message AdminDeleteBlockUserResponse {}

message GetMyFollowsResponse {
  repeated string ids = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}
message AdminGetMyFollowsResponse {
  repeated string ids = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}
message GetMyFollowersResponse {
  repeated string ids = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}
message AdminGetMyFollowersResponse {
  repeated string ids = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}
message GetMyBlocksResponse {
  repeated string ids = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}
message AdminGetMyBlocksResponse {
  repeated string ids = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}
message GetWhoBlockedMeResponse {
  repeated string ids = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}
message AdminGetWhoBlockedMeResponse {
  repeated string ids = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}

message GetIsFollowingResponse {
  bool is_following = 1;
}

message AdminGetIsFollowingResponse {
  bool is_following = 1;
}

message CreatePostNodeResponse {}
message DeletePostNodeResponse {}
message PostUserOwnResponse {}
message AdminPostUserOwnResponse {}
message DeleteUserOwnResponse {}
message AdminDeleteUserOwnResponse {}

message GetPostNodeResponse {
  bool exists = 1;
}
message GetUserPostsResponse {
  repeated string ids = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}
message AdminGetUserPostsResponse {
  repeated string ids = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}
message GetFeedResponse {
  repeated string ids = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}
message AdminGetFeedResponse {
  repeated string ids = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}

message PostLikePostResponse {}
message AdminPostLikePostResponse {}
message DeleteLikePostResponse {}
message AdminDeleteLikePostResponse {}

message GetUserLikesResponse {
  repeated string ids = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}
message AdminGetUserLikesResponse {
  repeated string ids = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}
message GetPostLikersResponse {
  repeated string ids = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}

message CreateEventNodeResponse {}
message DeleteEventNodeResponse {}
message PostUserEventResponse {}
message DeleteUserEventResponse {}
message PostUserParticipateEventResponse {}
message AdminPostUserParticipateEventResponse {}
message DeleteUserParticipateEventResponse {}
message AdminDeleteUserParticipateEventResponse {}
message PostUserWishEventResponse {}
message AdminPostUserWishEventResponse {}
message DeleteUserWishEventResponse {}
message AdminDeleteUserWishEventResponse {}

message GetUserEventResponse {
  repeated string ids = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}
message AdminGetUserEventResponse {
  repeated string ids = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}
message GetUserParticipateEventResponse {
  repeated string ids = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}
message AdminGetUserParticipateEventResponse {
  repeated string ids = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}
message GetUserWishEventResponse {
  repeated string ids = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}
message AdminGetUserWishEventResponse {
  repeated string ids = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}
message GetEventParticipantsResponse {
  repeated string ids = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}

message LinkPostToEventResponse {}
message UnlinkPostFromEventResponse {}

message GetEventRelatedToPostResponse {
  string event_id = 1;
}

message EventPostLink {
  string post_id = 1;
  string event_id = 2;
}

message GetEventsRelatedToPostsResponse {
  repeated EventPostLink links = 1;
}
message GetEventPostsResponse {
  repeated string ids = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}

message GetEventNodeResponse {
  bool exists = 1;
}

// Each list holds at most 1000 ids (the cap of SearchEventsQuery in ms-event), in a stable order.
// A truncated flag is true when more ids exist than were returned.
message GetSearchExclusionsResponse {
  // Union of the created, participated and wished events the query asked for.
  repeated string excluded_event_ids = 1;
  // Users the caller blocked and users who blocked the caller.
  repeated string hidden_user_ids = 2;
  bool excluded_event_ids_truncated = 3;
  bool hidden_user_ids_truncated = 4;
}

message GetRecommendedEventIdsResponse {
  repeated string ids = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}

message AdminGetRecommendedEventIdsResponse {
  repeated string ids = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}

message SetEventAttendanceResponse {}

message EventAttendee {
  string user_id = 1;
  google.protobuf.Timestamp registered_at = 2;
  optional google.protobuf.Timestamp checked_in_at = 3;
}

message GetEventAttendeesResponse {
  repeated EventAttendee attendees = 1;
  volontariapp.common.PaginationResponse pagination = 2;
}

message EventParticipantCount {
  string event_id = 1;
  // Number of registered participants. The implicit creator is NOT counted
  // (same semantics as GetEventParticipantsResponse.pagination.total).
  int32 participant_count = 2;
}

message CountEventParticipantsResponse {
  // One entry per requested event id (0 when the event has no participant).
  repeated EventParticipantCount counts = 1;
}

message PostLikeSummary {
  string post_id = 1;
  int32 like_count = 2;
  // Whether the calling user (internal token) likes this post.
  bool liked_by_me = 3;
}

message GetPostsLikeSummaryResponse {
  // One entry per requested post id (like_count 0 when never liked).
  repeated PostLikeSummary summaries = 1;
}
